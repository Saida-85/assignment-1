<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConf 2026 Landing Page Design</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- header section start here -->
    <header>
        <nav class="container">
            <img src="./assets/logo.png" alt="logo-png">
            <ul>
                <li><a href="">Speakers</a></li>
                <li><a href="">Schedule</a></li>
                <li><a href="">Tracks</a></li>
                <li><a href="">Venue</a></li>
                <li><a href="">Blog</a></li>
            </ul>
            <button class="register-now-btn">Register Now</button>
        </nav>
    </header>
    <!-- header section end here -->

    <!-- section start -->
    <section class="banner-parent">
        <img src="./assets/banner.jpg" alt="banner">

        <div class="overlay"></div>

        <div class="banner-text">
            <h2>Code. <em>Connect.</em> Create</h2>
            <p>Join 4,000+ engineers, founders, and builders at the premier developer <br>
                conference of 2026. Three days
                of cutting-edge talks, hands-on workshops, <br>
                and meaningful connections.
            </p>
            <button class="register-now-btn">Register Now</button>
        </div>
    </section>
    <!-- section end here -->
</body>

</html>
